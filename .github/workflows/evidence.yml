name: Evidence

# Manual runs only. For one git ref and a list of Python versions this runs the same test command as CI, the
# stage-rename mutants and, optionally, named mutant scripts, each on its own runner with a throwaway Postgres.
# It deploys nothing, uses no secrets and reads the repository only. Raw logs are uploaded as artifacts so that
# a reviewer reads the files and not a summary.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or full commit SHA to test"
        required: true
        type: string
      pythons:
        description: 'JSON list of Python versions, for example ["3.13","3.12"]'
        required: false
        default: '["3.13","3.12"]'
        type: string
      mutant_scripts:
        description: "Optional extra mutant runners, space separated, each tests/<name>_mutants.py (for example tests/textnorm_mutants.py)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: evidence-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.pythons) }}
    services:
      postgres:
        image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      vault:
        image: hashicorp/vault:2.2.0@sha256:e0acd3c681bdf57f002d7214e5d050b876e1704678005c6b0406dd96a65be919
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          SKIP_SETCAP: "true"
        ports:
          - 8200:8200
        options: >-
          --health-cmd "VAULT_ADDR=http://127.0.0.1:8200 vault status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HADAVIN_TEST_PG_DSN: postgresql://postgres@localhost:5432/postgres
      HADAVIN_TEST_VAULT_ADDR: http://127.0.0.1:8200
      INPUT_REF: ${{ inputs.ref }}
      INPUT_MUTANTS: ${{ inputs.mutant_scripts }}
      PY: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          checksum: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
          python-version: ${{ matrix.python }}
          activate-environment: true
          cache-suffix: "evidence"
      - name: Head and runner (first line of every log)
        run: |
          mkdir -p evidence-logs
          sha=$(git rev-parse HEAD)
          echo "$sha" > evidence-logs/head.txt
          safe=$(printf '%s' "$INPUT_REF" | tr -c 'A-Za-z0-9._-' '-')
          echo "ART=evidence-${safe}-${sha:0:8}-${PY}" >> "$GITHUB_ENV"
          { echo "$sha"; python --version; nproc; psql --version; } | tee evidence-logs/env.txt
      - name: Install (locked)
        run: uv sync --locked --no-build --all-extras --group test
      - name: Tests (the CI command)
        run: |
          set -o pipefail
          { git rev-parse HEAD; pytest -q -m "not live and not perf" -rfEs; } 2>&1 | tee evidence-logs/pytest.txt
      - name: Performance tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          { git rev-parse HEAD; pytest -q -m perf -rfEs; } 2>&1 | tee evidence-logs/perf.txt
      - name: Stage-rename mutants
        if: ${{ !cancelled() && hashFiles('tests/stage_mutants.py') != '' }}
        run: |
          set -o pipefail
          { git rev-parse HEAD; python tests/stage_mutants.py; rc=$?; echo "exit=$rc"; exit $rc; } 2>&1 | tee evidence-logs/stage-mutants.txt
      - name: Extra mutant runners (names checked, never run as free text)
        if: ${{ !cancelled() && inputs.mutant_scripts != '' }}
        run: |
          set -o pipefail
          for s in $INPUT_MUTANTS; do
            case "$s" in
              tests/[a-z0-9_]*_mutants.py) ;;
              *) echo "refused runner name: $s"; exit 2 ;;
            esac
            [ -f "$s" ] || { echo "no such runner: $s"; exit 2; }
            { git rev-parse HEAD; python "$s"; rc=$?; echo "exit=$rc"; exit $rc; } 2>&1 | tee "evidence-logs/$(basename "$s" .py).txt"
          done
      - name: Failing test names in the summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### $ART"
            echo "head: $(cat evidence-logs/head.txt) python: $PY"
            for f in evidence-logs/*.txt; do
              echo "#### $(basename "$f")"
              echo '```'
              grep -E '^(FAILED|ERROR) |passed|failed|exit=' "$f" | tail -40 || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the raw logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.ART }}
          path: evidence-logs/
          retention-days: 30
