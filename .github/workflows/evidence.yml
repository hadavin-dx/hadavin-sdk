name: Evidence

# Manual runs only. For one git ref and a list of Python versions this runs the same test selection as CI (the
# "check" job in ci.yml; the report flag differs: -rfEs here, -rs there), the stage-rename mutants and, optionally, named mutant scripts, each on its own runner
# with a throwaway Postgres and a throwaway Vault development server. It deploys nothing, uses no stored secrets
# and reads the repository only. Every step writes its raw log and its exit code to a folder under the runner's temp directory (outside the checkout, so no log can become part of the tested files),
# and a last
# step fails the run unless every step has exit=0 (a step that never ran counts as NOT RUN, not as a pass).
# All typed input is checked by tools/evidence_step.py (allowlists) in the "plan" job before any runner starts;
# no run: script contains a ${{ }} expression (a guard test enforces it).
# The tested ref must itself read the per-run Vault token from HADAVIN_TEST_VAULT_TOKEN
# (tests/contracts/kinds/secrets_neutral.py). The step "vault-token-reader" runs right after the checkout and fails
# the run at once if that file has no code line reading it: an older ref would send its built-in token to a server
# that has a random one and its Vault tests would fail with a 403. The helper removes the token's value, and any
# piece of it of 8 or more characters taken from its start or end, from every saved log and from the summary (best
# effort for plain text; a value split by a line break in the middle is not recognised). A skipped test whose reason
# names a HADAVIN_TEST_ variable also fails the run (the report counts skips). The token is in the environment of
# every step after the Vault step, including the steps that run the tested code: that code can read it, and it is
# worthless once the container is removed. Refs of the form pull/N/head are not supported; pass the branch name or
# the commit SHA. The static checks in tests/test_evidence_workflow_guard.py are best effort: they catch the usual
# ways to print or publish the token, not every possible way.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or full commit SHA to test"
        required: true
        type: string
      pythons:
        description: 'JSON list of 1 to 4 Python versions, each 3.12, 3.13 or 3.14, for example ["3.13","3.12"]'
        required: false
        default: '["3.13","3.12"]'
        type: string
      mutant_scripts:
        description: "Optional extra mutant runners, space separated, at most 8, each tests/<name>_mutants.py (for example tests/mutation_runner_mutants.py)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# A second run for the same ref and inputs waits for the first; it never cancels a running one (a cancelled run
# loses its evidence). GitHub keeps one waiting run per group: a third request replaces the waiting second one.
concurrency:
  group: evidence-${{ inputs.ref }}-${{ inputs.pythons }}-${{ inputs.mutant_scripts }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pythons: ${{ steps.check.outputs.pythons }}
      mutants: ${{ steps.check.outputs.mutants }}
      ref: ${{ steps.check.outputs.ref }}
      tool: ${{ steps.export.outputs.tool }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/evidence_step.py
          sparse-checkout-cone-mode: false
      - name: Check the typed inputs (allowlists)
        id: check
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PYTHONS: ${{ inputs.pythons }}
          INPUT_MUTANTS: ${{ inputs.mutant_scripts }}
        timeout-minutes: 2
        run: python3 tools/evidence_step.py plan
      - name: Hand the helper to the evidence jobs (from the commit that holds this workflow)
        id: export
        timeout-minutes: 2
        run: echo "tool=$(base64 -w0 tools/evidence_step.py)" >> "$GITHUB_OUTPUT"
      - name: Resolve the ref to one commit (every Python version tests the same commit)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.check.outputs.ref }}
        timeout-minutes: 2
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "ref did not resolve to a commit"; exit 2; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  evidence:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150  # the step timeouts below add up to 147 minutes
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons) }}
    services:
      postgres:
        image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HADAVIN_TEST_PG_DSN: postgresql://postgres@localhost:5432/postgres
      HADAVIN_TEST_VAULT_ADDR: http://127.0.0.1:8200
      # The text-folding tables are built for Unicode 15.1.0 (Python 3.13), as in ci.yml; other versions must not set it.
      HADAVIN_REQUIRE_PINNED_UNIDATA: ${{ matrix.python == '3.13' && '1' || '' }}
      PYTHONUNBUFFERED: "1"
      REF: ${{ needs.plan.outputs.ref }}
      MUTANTS: ${{ needs.plan.outputs.mutants }}
      PY: ${{ matrix.python }}
      COLUMNS: "300"  # pytest cuts long lines at the terminal width; a wide width keeps a printed value in one piece
      VAULT_IMAGE: hashicorp/vault:2.2.0@sha256:e0acd3c681bdf57f002d7214e5d050b876e1704678005c6b0406dd96a65be919
    steps:
      # The helper comes from the commit that holds this workflow (so a ref without it can still be tested) and, with
      # the logs, lives under the runner temp directory, outside the checkout.
      - name: Put the helper and the evidence folder outside the checkout
        timeout-minutes: 2
        env:
          TOOL_B64: ${{ needs.plan.outputs.tool }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence-logs"
          printf '%s' "$TOOL_B64" | base64 -d > "$RUNNER_TEMP/evidence_step.py"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence-logs" >> "$GITHUB_ENV"
          echo "TOOL=$RUNNER_TEMP/evidence_step.py" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: The tested ref reads the per-run Vault token (else the Vault tests would use the fixed token and fail)
        timeout-minutes: 2
        run: |
          python3 "$TOOL" run vault-token-reader -- grep -Eq '^[^#]*(environ|getenv)[^#]*HADAVIN_TEST_VAULT_TOKEN' tests/contracts/kinds/secrets_neutral.py
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          checksum: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
          python-version: ${{ matrix.python }}
          activate-environment: true
          cache-suffix: "evidence"
      - name: Artifact name and runner facts
        timeout-minutes: 2
        run: |
          sha=$(git rev-parse HEAD)
          safe=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9._-' '-')
          echo "ART=evidence-${safe}-${sha:0:8}-${PY}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          { echo "$sha"; python --version; nproc; } | tee "$EVIDENCE_DIR/env.txt"
      # A fresh random token for this run only; masked in the Actions log, removed from the saved files by the helper, and in the environment of every later step. The server listens on this
      # runner's loopback address only and is removed in the last step.
      - name: Start a throwaway Vault development server
        timeout-minutes: 5
        run: |
          token=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "HADAVIN_TEST_VAULT_TOKEN=$token" >> "$GITHUB_ENV"
          export VAULT_DEV_ROOT_TOKEN_ID="$token"
          docker run -d --name vault-ci -p 127.0.0.1:8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 -e SKIP_SETCAP=true \
            "$VAULT_IMAGE" > /dev/null
          # Probe from the host, with the token, the way the tests will reach the server (the published port).
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' vault-ci)" != "true" ]; then
              echo "the Vault container exited"
              docker ps -a
              docker logs vault-ci 2>&1 | sed "s/$token/***/g"
              exit 1
            fi
            curl -fsS -o /dev/null -H "X-Vault-Token: $token" http://127.0.0.1:8200/v1/auth/token/lookup-self && exit 0
            sleep 2
          done
          echo "Vault did not answer on 127.0.0.1:8200 within 60 seconds"
          docker ps -a
          docker logs vault-ci 2>&1 | sed "s/$token/***/g"
          exit 1
      - name: Install (locked)
        id: install
        timeout-minutes: 15
        run: python3 "$TOOL" run install -- uv sync --locked --no-build --all-extras --group test
      - name: The postgres client the database tests shell out to is present (else they would skip silently)
        timeout-minutes: 2
        run: python3 "$TOOL" run psql-present -- psql --version
      - name: Tests (the CI command)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 45
        run: python3 "$TOOL" run pytest -- pytest -q -m "not live and not perf" -rfEs
      - name: Performance tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 20
        run: python3 "$TOOL" run perf -- pytest -q -m perf -rfEs
      - name: Stage-rename mutants
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 20
        run: python3 "$TOOL" run stage-mutants -- python tests/stage_mutants.py
      - name: Extra mutant runners (names checked by the plan job, never run as free text)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.plan.outputs.mutants != '' }}
        timeout-minutes: 30
        run: |
          fail=0
          for s in $MUTANTS; do
            name=extra-$(basename "$s" .py | tr _ -)
            python3 "$TOOL" run "$name" -- python "$s" || fail=1
          done
          exit $fail
      - name: Verdict (fails unless every step has exit=0; a step that did not run is NOT RUN)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          extra=""
          for s in $MUTANTS; do extra="$extra extra-$(basename "$s" .py | tr _ -)"; done
          # $extra holds only names the plan job accepted, so word splitting is safe.
          python3 "$TOOL" report install psql-present vault-token-reader pytest perf stage-mutants $extra
      - name: Remove the Vault development server
        if: ${{ always() }}
        timeout-minutes: 2
        run: docker ps -aq --filter 'name=^vault-ci$' | xargs -r docker rm -f
      - name: Upload the raw logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.ART }}
          path: ${{ runner.temp }}/evidence-logs/
          if-no-files-found: error
          retention-days: 30
