# Settings of tools/demo_only_guard.py. Everything that exists only for demos (made-up data, example prompts, recorded
# model replies, test fixtures) lives in one folder. The product, meaning the code that is shipped to a client, never
# depends on it; deleting that folder must leave a build whose tests still pass. The folder name is written here once.

# the folder name, at the repository root
folder = "demo_only"

# folders whose files are product code or ship with it; every file under them is scanned and the demo-only folder must
# not sit inside any of them. A listed folder that does not exist is a hit (it would make the scan prove nothing).
product_roots = ["src", "templates", "tools", "demos"]

# the only product files that may name the folder (the config-selected loader), each at most `loader_max_lines` lines.
# Each entry must exist and must name the folder, otherwise the guard reports it as stale. A loader is still checked
# for made-up record ids.
loaders = []
loader_max_lines = 1

# regular expressions of made-up record ids that product code must never contain (one pattern per kind of fake id).
# Empty in core: core ships no fake records. A demo repository lists its own ids here.
fake_id_patterns = []

# files that must hold the folder name because they are the guard itself; their content is not searched, but each must be
# a regular file (not a link) within `max_file_bytes`. A test pins this list.
exempt_files = ["tools/demo_only_guard.py", "tools/demo_only_guard.toml"]

# exact phrases that look like the folder name but are not it: the name of core's table of demo-only kinds, and
# sentences that say "demo only". Each must occur in the product, otherwise the guard reports it as stale.
allowed_phrases = ["DEMO_ONLY", "demo-only kinds", "demo only;", "demo only)"]

# packages the copy run (--without-folder) must import from the copy, never from the original checkout
product_packages = ["hadavin_sdk"]

# a repository that has the folder adds this (empty) file to say its CI runs `--without-folder-if-present`
copy_run_marker = "tools/demo_only_guard.copy_run"

# endings of files that are known not to be text; every other file is read, and a file that is neither text nor on
# this list is refused. A file with one of these endings must start with the mark of its kind (png, jpeg, gif, ico, pdf, woff,
# woff2: see ENDING_MARKS in the guard), and an ending with no known mark cannot be listed here.
skip_suffixes = [".png", ".jpg", ".jpeg", ".gif", ".ico", ".pdf", ".woff", ".woff2"]

# a file bigger than this many bytes is not read; it is a hit (a very large file cannot be searched in memory)
max_file_bytes = 8388608

# the only environment variables the copy run's pytest child receives; a demo repository adds the plain, non-secret names its tests need.
# The database and Vault variables (HADAVIN_TEST_PG_DSN, HADAVIN_TEST_VAULT_ADDR) are left out on purpose: those tests skip in the copy.
child_env_allowed = ["PATH", "HOME", "LANG", "LC_ALL", "LC_CTYPE", "TMPDIR", "TEMP", "TMP", "SYSTEMROOT", "TERM", "VIRTUAL_ENV", "HADAVIN_REQUIRE_NODE"]
