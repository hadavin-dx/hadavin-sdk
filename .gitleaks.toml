# gitleaks configuration: the default rules plus three allowlists (the second is TEMPORARY, see below it; the third is the textnorm golden fixture, at the end of the file).
# First allowlist: anchored on the file path AND on the whole finding
# (regexTarget is the finding's secret, so each regex must match ALL of it: a real key block or any other value in that
# file is still reported). It does not depend on a commit id, so a squash or rebase of the branch that adds the file
# cannot invalidate it. The file it names is on another branch's history (a scanner test); CI scans every fetched ref, so
# the entry is needed there even where the file is absent from this tree. `condition = "AND"` means the path AND a
# regex must both match (checked: the same header lines in any other path are reported, and so is a real key block in
# that path).
[extend]
useDefault = true

[[allowlists]]
description = "tests/demo_askdata/test_demo_literals.py is a scanner test: it plants fake literals to prove its own scan catches them. Allowed: a finding that is ONLY PEM header lines (no key body), or exactly the placeholder abcdefgh12345678"
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/demo_askdata/test_demo_literals\.py$''']
regexes = [
    '''^(?:-----BEGIN [A-Z ]*PRIVATE KEY-----",\s*"){0,2}-----BEGIN [A-Z ]*PRIVATE KEY-----$''',
    '''^abcdefgh12345678$''',
]

# TEMPORARY (same lifetime as the .gitleaksignore entries: delete when branch core/cloud-handover is deleted; owner approved 2026-11-05).
# The cloud session's review and ticket notes (markdown prose on that branch) quote file names, identifiers and test values;
# the entropy heuristic generic-api-key flags prose lines there on every pull request. Only that one heuristic rule is
# allowed, only for markdown under handover/{reviews,tickets,evidence}/ . The scope is by PATH, not by branch: CI fails if
# any such path exists in the checked-out tree (see the step 'Stale gitleaks ignore entries'). All specific rules (cloud keys, private keys,
# tokens) and every other path stay fully scanned.
[[allowlists]]
description = "temporary: entropy heuristic only, markdown notes of the handover branch"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^handover/(reviews|tickets|evidence)/[^/]+\.md$''']

# Golden file of the text-normalisation corpus (package P1a): it stores one sha256 digest per row under the field name
# "identity_key". The name contains "key" and the value is 64 hex digits, so the entropy heuristic fires. Allowed: ONLY the
# generic-api-key rule, ONLY in that file, ONLY when the whole finding is exactly 64 lowercase hex digits. Any other rule,
# any other value shape (a real key, token or longer string) and every other path stay fully scanned. Not temporary: the
# fixture is part of the product tests. CI scans every fetched ref, so this entry must be on main before the file is.
[[allowlists]]
description = "textnorm golden fixture: sha256 digests under identity_key (entropy heuristic only, exact 64-hex shape, one path)"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''^tests/fixtures/textnorm_golden\.json$''']
regexes = ['''^[0-9a-f]{64}$''']
