[project]
name = "hadavin-sdk"
version = "0.1.0"
description = "Shared building blocks for Hadavin's AI builds"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Hadavin" }]
# PyPI refuses any upload carrying this classifier.
classifiers = ["Private :: Do Not Upload"]
# Base: typed models, settings and YAML config only. No vendor SDK; each cloud backend is an optional extra added
# when a build needs it. Pins are at least 7 days old (Dependabot cooldown).
dependencies = [
    "markdown-it-py==4.2.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
]

# Optional extras: install only the backends a client uses (design 12.5). `gemini` and `openai_compat` use
# the standard library and need none.
[project.optional-dependencies]
anthropic = ["anthropic[vertex]==2.1.0"]
aws = ["boto3==1.43.122", "botocore==1.43.122", "cryptography==50.0.2"]
signer = ["cryptography==50.0.2"]
pg = ["psycopg[binary]==3.3.6"]
# The Ask-your-data demo (demos/ask-your-data): its own parser and driver pins.
askdata = ["sqlglot==30.26.0", "psycopg[binary]==3.3.6"]
# Cloud-neutral backends: secret stores (P4b; `vault` and `mounted_file` need no extra), audit signers and
# anchors (P3b).
azure = [
    "azure-identity==1.26.0",
    "azure-keyvault-keys==4.11.3",
    "azure-keyvault-secrets==4.12.0",
    "azure-storage-blob==12.31.0",
    "cryptography==50.0.2",
]
gcp = [
    "cryptography==50.0.2",
    "google-cloud-kms==3.18.0",
    "google-cloud-secret-manager==2.31.0",
    "google-cloud-storage==3.17.1",
]

[project.scripts]
hadavin-sdk = "hadavin_sdk.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.1"]
# Contract-suite stand-ins for cloud services (CI installs it with every extra).
test = ["moto[s3,kms,secretsmanager]==5.2.5", "pglast==8.7"]
# Free scanners that keep working when the repository turns private.
scan = ["pip-audit==2.10.1", "bandit==1.9.4", "zizmor==1.31.1"]
# Static checks beyond ruff (job "lint-set" in ci.yml; actionlint is a Go binary, installed there by checksum).
lint = ["mypy==2.4.1", "types-pyyaml==6.0.12.20261030", "boto3-stubs==1.43.122", "botocore-stubs==1.43.122", "import-linter==2.15", "deptry==0.25.1", "vulture==2.16"]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Release cooldown comes from Dependabot (7 days); pins are exact so the lock only changes through its PRs.
default-groups = ["dev"]
# Transitive packages of the azure/gcp extras whose newest releases were under 7 days old when locked
# (2026-10-31); Dependabot moves these once they age.
exclude-newer-package = { google-api-core = "2026-10-24T00:00:00Z", grpcio = "2026-10-24T00:00:00Z", grpcio-status = "2026-10-24T00:00:00Z" }

[tool.ruff]
line-length = 100
extend-exclude = ["vulture_whitelist.py"]  # not Python to run: names for vulture to count as used
src = ["src", "tests", "demos"]

[tool.ruff.lint]
# `select` is spelled out and restates ruff's own default first (E4, E7, E9, F: syntax and I/O errors, bare except,
# comparisons to None/True, lambda assignment, ambiguous names, undefined and unused names), then W (whitespace; 0
# findings, kept so it stays 0). With `extend-select` alone ruff 0.17.1 does not report RUF100 for noqa codes of
# rules that are not enabled (measured: 0 findings against 158 with `select`), so the whole list is explicit.
select = [
    "E4", "E7", "E9", "F", "W",
    "B", "DTZ", "I", "S", "TID", "UP",
    # Order 144 (2026-11-07): bug-finding and simplification rules (38 findings on main in src/), plus unused noqa.
    "C4", "SIM", "PERF", "ASYNC", "RET", "PIE", "LOG", "FURB", "PGH", "RSE", "SLOT", "FLY", "YTT",
    "PLE", "PLW", "PLC", "RUF100",
]
# No rule is switched off for the whole repository. The two selected rules that some files must break (PLC0415 and
# SIM112) are exempted by file name below, each with its reason.

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only: the import rules in tests/ read module names, and a relative import hides one.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    # PLC0415 (import not at top of file): tests import inside the test so one broken module fails one test, not the
    # whole collection; 430 findings, kept lazy on purpose.
    "PLC0415",
]
# PLC0415 in code under src/ and demos/ is lazy on purpose, file by file: an optional extra imported inside
# try/except ImportError (anthropic: google-auth; postgres: the aws auth helper; htmlexport/validate: demo extras), a
# platform module (meter: msvcrt/fcntl), a private stdlib module with a guard (redact: re._compiler), the command line
# and the config keeping start-up and the secret-holder boundary small (cli, config), and imports that break a cycle
# (channel, chain, report, tick). Moving them to the top would make an optional extra required or create a cycle.
"src/hadavin_sdk/approvals/channel.py" = ["PLC0415"]
"src/hadavin_sdk/audit/chain.py" = ["PLC0415"]
"src/hadavin_sdk/cli.py" = ["PLC0415"]
"src/hadavin_sdk/config.py" = ["PLC0415"]
"src/hadavin_sdk/guard/redact.py" = ["PLC0415"]
"src/hadavin_sdk/k1b/report.py" = ["PLC0415"]
"src/hadavin_sdk/llm/anthropic.py" = ["PLC0415"]
"src/hadavin_sdk/runtime/tick.py" = ["PLC0415"]
"src/hadavin_sdk/store/postgres.py" = ["PLC0415"]
"demos/ask-your-data/askdata/cli.py" = ["PLC0415"]
"demos/ask-your-data/askdata/htmlexport.py" = ["PLC0415"]
"demos/ask-your-data/askdata/meter.py" = ["PLC0415"]
"demos/ask-your-data/askdata/validate.py" = ["PLC0415"]
# SIM112 (capitalized environment variable): Windows names its folder variable `SystemRoot`; the mutation runner and
# its test set it under that name on every platform, and the uppercase spelling does not find it on Linux.
"tools/mutation_runner.py" = ["SIM112"]
"tests/test_mutation_runner.py" = ["SIM112"]
# S603 (subprocess call): the ratchet runs mypy with a fixed argv (our own interpreter, no shell, a temp config path we
# wrote). It must not `import mypy`: deptry reads that as a dev dependency used in shipped code (DEP004).
"tools/mypy_ratchet.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so fixture check modules (tests.fixtures.checks) resolve by name.
pythonpath = ["."]
markers = [
    "live: calls a real paid or cloud service; CI deselects it, run only on the owner's yes",
    "perf: timing tests (redaction patterns, end to end with views); CI runs them in their own step, which blocks a merge",
]

# Import contracts. They restate rules that tests/test_repo_rules.py already checks with its own scanner (K5 / M21),
# now by a maintained graph tool; both stay. Imports under `if TYPE_CHECKING:` do not run, so they are not counted.
[tool.importlinter]
root_packages = ["hadavin_sdk", "askdata"]
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Packages that must stay secret-free never reach a secret holder, even through other modules"
type = "forbidden"
source_modules = [
    "hadavin_sdk.runtime",
    "hadavin_sdk.approvals",
    "hadavin_sdk.llm",
    "hadavin_sdk.sources",
    "hadavin_sdk.tools",
    "hadavin_sdk.guard.http",
    "hadavin_sdk.guard.runmap",
    "hadavin_sdk.guard.egress",
]
forbidden_modules = [
    "hadavin_sdk.actions.secrets",
    "hadavin_sdk.actions.secrets_env",
    "hadavin_sdk.actions.secrets_aws",
    "hadavin_sdk.actions.secrets_vault",
    "hadavin_sdk.actions.secrets_azure",
    "hadavin_sdk.actions.secrets_gcp",
    "hadavin_sdk.actions.secrets_file",
    "hadavin_sdk.actions.secrets_cache",
    "hadavin_sdk.actions.executor",
    "hadavin_sdk.backends.platform_secrets",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "tools never reaches the actions package, even through other modules"
type = "forbidden"
source_modules = ["hadavin_sdk.tools"]
forbidden_modules = ["hadavin_sdk.actions"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "stages is a leaf module (it imports nothing else of the package)"
type = "forbidden"
source_modules = ["hadavin_sdk.stages"]
forbidden_modules = [
    "hadavin_sdk.config",
    "hadavin_sdk.app",
    "hadavin_sdk.deferred",
    "hadavin_sdk.registry",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Vendor cloud SDKs are imported only inside their own kind module"
type = "forbidden"
source_modules = ["hadavin_sdk"]
forbidden_modules = ["boto3", "botocore", "anthropic", "google", "azure", "kubernetes"]
allow_indirect_imports = true
ignore_imports = [
    "hadavin_sdk.llm.bedrock -> boto3",
    "hadavin_sdk.llm.bedrock -> botocore",
    "hadavin_sdk.actions.secrets_aws -> boto3",
    "hadavin_sdk.audit.anchor_s3 -> boto3",
    "hadavin_sdk.audit.anchor_s3 -> botocore",
    "hadavin_sdk.audit.signer_aws -> boto3",
    "hadavin_sdk.audit.signer_aws -> botocore",
    "hadavin_sdk.guard.bedrock_guardrail -> boto3",
    "hadavin_sdk.guard.bedrock_guardrail -> botocore",
    "hadavin_sdk.store.auth_aws -> boto3",
    "hadavin_sdk.llm.anthropic -> anthropic",
    "hadavin_sdk.llm.anthropic -> google",
    "hadavin_sdk.actions.secrets_gcp -> google",
    "hadavin_sdk.audit.anchor_gcs -> google",
    "hadavin_sdk.audit.signer_gcp -> google",
    "hadavin_sdk.actions.secrets_azure -> azure",
    "hadavin_sdk.audit.anchor_azure -> azure",
    "hadavin_sdk.audit.signer_azure -> azure",
]

[[tool.importlinter.contracts]]
name = "The core never imports a demo"
type = "forbidden"
source_modules = ["hadavin_sdk"]
forbidden_modules = ["askdata"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "A demo never reaches the executor or any secret holder"
type = "forbidden"
source_modules = ["askdata"]
forbidden_modules = [
    "hadavin_sdk.actions.executor",
    "hadavin_sdk.actions.secrets",
    "hadavin_sdk.actions.secrets_env",
    "hadavin_sdk.actions.secrets_aws",
    "hadavin_sdk.actions.secrets_vault",
    "hadavin_sdk.actions.secrets_azure",
    "hadavin_sdk.actions.secrets_gcp",
    "hadavin_sdk.actions.secrets_file",
    "hadavin_sdk.actions.secrets_cache",
    "hadavin_sdk.backends.platform_secrets",
]
allow_indirect_imports = false

[tool.vulture]
# Dead code in the shipped package. tests, demos and tools use the core, so their own helper names are not judged here.
paths = ["src", "vulture_whitelist.py"]
min_confidence = 60
ignore_decorators = ["@model_validator", "@field_validator"]
# Names the standard library or pydantic calls: HTTP handler methods, urllib handler methods, pydantic's model_config.
ignore_names = ["model_config", "do_POST", "do_GET", "log_message", "http_open", "https_open", "redirect_request"]

[tool.deptry]
# The package itself and the demo's own package are first party (deptry does not see them in this src layout).
known_first_party = ["hadavin_sdk", "askdata"]

[tool.mypy]
# Basic mode (mypy's default strictness) on the shipped package, rolled out module by module. The modules listed in the
# override at the end still have findings (79 in 28 files on 2026-11-07; counted with the stubs installed, and the
# same 79 on main's src). They ARE read, so their types help the clean files, but their own findings are not
# reported. The list is a ratchet: `python tools/mypy_ratchet.py` fails when a listed module is clean or missing
# (delete its line) and when an unlisted module has a finding. It is ordered by risk, highest first, so the order of
# work is top to bottom. tests, demos and tools are not checked yet.
files = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
follow_imports = "silent"

[[tool.mypy.overrides]]
ignore_errors = true
module = [
    # 1. Money, redaction, approvals and secrets: fix first.
    "hadavin_sdk.guard.redact",
    "hadavin_sdk.guard.runmap",
    "hadavin_sdk.guard.judge",
    "hadavin_sdk.guard.bedrock_guardrail",
    "hadavin_sdk.approvals.gate",
    "hadavin_sdk.approvals.requests",
    "hadavin_sdk.actions.executor",
    "hadavin_sdk.tools",
    # 2. Audit trail and signers, and the database.
    "hadavin_sdk.audit.chain",
    "hadavin_sdk.audit.signer",
    "hadavin_sdk.audit.signer_aws",
    "hadavin_sdk.audit.signer_azure",
    "hadavin_sdk.audit.signer_gcp",
    "hadavin_sdk.audit.signer_vault",
    "hadavin_sdk.audit.anchor_gcs",
    "hadavin_sdk.store.postgres",
    "hadavin_sdk.store.migrate",
    "hadavin_sdk.store.migration_numbers",
    # 3. Configuration, wiring and the rest.
    "hadavin_sdk.config",
    "hadavin_sdk.registry",
    "hadavin_sdk.app",
    "hadavin_sdk.evals",
    "hadavin_sdk.runtime.agent_loop",
    "hadavin_sdk.k1b.bundle",
    "hadavin_sdk.k1b.loop",
    "hadavin_sdk.k1b.report",
    # 4. Blocked by the boto3 stubs (client() has one overload per service name; a non-literal name fails).
    "hadavin_sdk.llm.bedrock",
    "hadavin_sdk.llm.retry",
]
