# Wave 1 — ECS / Fargate + CloudWatch.  14 scenarios.
#
# ⛔ NOTHING IN THIS FILE IS EVER SHOWN TO WARDEN.  The runner reads it to break things and to put
# them back; the scorer reads it to grade.  The tool under test receives only what a real operator
# would have: a backend name, a cluster name, a service name and an alert timestamp.
# `tests/test_no_scenario_leakage.py` fails CI if any id or fault_class below appears anywhere
# under src/warden/.
#
# ⛔ AND THERE IS NO EXPECTED HYPOTHESIS TEXT HERE, deliberately.  Grading prose against prose is
# where a benchmark quietly becomes an opinion.  Only the typed ActionKind, the typed VerdictStatus
# and the typed context fields are scored — see ../SCORING.md.
#
# ---------------------------------------------------------------------------------------------
# FIDELITY.  Every scenario declares how real it is, and this is not decoration:
#
#   real         the fault is genuine and AWS produces every symptom.  We chose WHAT breaks; the
#                kernel, the ECS agent and CloudWatch produced the evidence.
#   approximated we could not cause the true event and did something close.  The note says exactly
#                what the difference is.  Saying "Spot interruption" while calling StopTask would be
#                a small lie, and small lies are what a hostile reader finds first.
#
# 13 of the 14 below are `real`.  One is `approximated` and says so.
# ---------------------------------------------------------------------------------------------
#
# The `inject` / `revert` op vocabulary is deliberately small and declarative so a reader can see
# exactly what was done to the account without reading Python.  Implemented in ../ops.py.
#
# ---------------------------------------------------------------------------------------------
# ⛔ CHANGED AFTER THE FIRST REAL RUN, ON 2026-09-10, AND SAID SO HERE RATHER THAN QUIETLY.
#
# Seven scenarios asserted `tasks_running < tasks_desired`.  Measured against a live account, that
# assertion is IMPOSSIBLE, and the benchmark was wrong rather than the tool:
#
#   ECS rolling deployments default to `minimumHealthyPercent: 100` and `maximumPercent: 200`.  The
#   OLD healthy tasks keep running until the new ones pass health checks, so a deploy that can never
#   succeed leaves capacity at desired FOREVER.  Running count does not fall - it RISES, to 3 of a
#   desired 2, while the doomed replacement waits.  The symptom was invented at a desk from an
#   intuition about what a broken deploy looks like, and AWS is specifically designed to prevent it.
#
# 27 of 42 runs in that wave scored NO-EVIDENCE as a result, which correctly reported the scenarios
# as unmeasurable rather than blaming the model.
#
# ⭐ What a failing rolling deploy ACTUALLY looks like, read from that run's own reports:
#
#     healthy service       deployments_in_flight = 1
#     any failing deploy    deployments_in_flight = 2   (the PRIMARY that cannot converge, plus the
#                                                        ACTIVE one it has not been allowed to replace)
#
# So the assertion is now `deployments_in_flight >= 2`.  ⚠ This is a weaker claim than the old one
# and it is worth being clear about that: it proves the backend saw a rollout that has not
# converged, not that users were affected.  It is what the evidence actually supports.
#
# ⛔ The FIRST run's results stand as published.  A benchmark that edits its fixtures until they
# pass has measured nothing; the point of that run is that it found this.
#
# ⛔ SECOND CHANGE, 2026-09-11.  `ecs-01-healthy-control` gains `deployments_in_flight == 1`.  A
# healthy control ran mid-rollout because the harness started the next scenario before the previous
# revert had converged; see that scenario's inline comment.  Stricter, not easier.  The harness bug
# that caused it is fixed separately in scenarios/runner.py - this assertion is the backstop that
# would have reported the contamination instead of scoring it.
# ---------------------------------------------------------------------------------------------

wave: 1
service: ecs
# Every scenario runs against this service in the proving ground.  It is named `checkout` because
# that is the service name in the bundled incidents, so no override is needed to point at it.
target_service: checkout

scenarios:

  # ===========================================================================================
  # The two controls.  Both are in Wave 1 on purpose: a benchmark that only injects real faults
  # measures sensitivity and never specificity, and that is how benchmarks flatter their authors.
  # ===========================================================================================

  - id: ecs-01-healthy-control
    title: Nothing is wrong
    fault_class: healthy_control
    fidelity: real
    signature_covered: false
    settle_seconds: 30
    inject: []
    revert: []
    # A healthy service still has evidence — it just does not have a fault.  Asserting that the
    # backend READ something here is what stops "no evidence" from silently passing as "healthy".
    evidence_assertions:
      - kind: metric_equal
        left: tasks_running
        right: tasks_desired
      - kind: metric_present
        name: tasks_desired
      # ⛔ ADDED 2026-09-11, after seeing results.  A healthy control once ran against a service
      # still rolling back from the previous scenario: 2 deployments in flight, 3 of 2 tasks
      # running.  `tasks_running == tasks_desired` held on two of its three runs anyway, so the
      # assertion above could not tell "healthy" from "mid-rollout", and two runs proposed rolling
      # back a service with nothing wrong.  This makes the control stricter, never easier: a run
      # that fails it is reported NO-EVIDENCE rather than scored as a false positive.
      - kind: metric_equal
        left: deployments_in_flight
        right_value: 1
    notes: >
      The false-positive test.  A tool that produces a confident root cause for a healthy service is
      worse than useless, because it trains its operators to ignore it.  Scored CORRECT only for
      no_action.

  - id: ecs-02-log-group-deleted
    title: The service's CloudWatch log group is deleted
    fault_class: log_group_deleted
    fidelity: real
    signature_covered: false
    settle_seconds: 60
    inject:
      - op: logs_delete_group
        log_group: /ecs/checkout
    revert:
      - op: logs_create_group
        log_group: /ecs/checkout
        retention_days: 1
    evidence_assertions:
      # The point of this scenario is the tool_errors entry, not the logs.
      - kind: tool_error_contains
        value: logs
      - kind: logs_empty
    notes: >
      The self-awareness test.  WARDEN's own evidence source is gone.  The right behaviour is a
      partial-context escalation (policy P8), not a confident diagnosis built on an absence.  A tool
      that cannot tell "I looked and found nothing wrong" from "I could not look" is dangerous, and
      this is the scenario that measures it.

  # ===========================================================================================
  # Faults introduced BY A DEPLOY.  A rollback genuinely fixes each of these, and the previous
  # revision is genuinely healthy, so `rollback_deploy` is CORRECT rather than merely plausible.
  # ===========================================================================================

  - id: ecs-03-oom-new-revision
    title: A new revision allocates more memory than the task reserves
    fault_class: oom_from_new_revision
    fidelity: real
    signature_covered: true
    signature_id: K8S-OOM-001
    settle_seconds: 240
    inject:
      - op: ecs_deploy_variant
        variant: oom
    revert:
      - op: ecs_deploy_baseline
    evidence_assertions:
      - kind: metric_gte
        left: deployments_in_flight
        right_value: 2
      - kind: deploys_nonempty
    notes: >
      Fargate performs the kill.  We chose a 900 MiB allocation inside a 512 MiB task; everything
      after that — the stopped-task reason, the missing capacity, the deployment record — is
      produced by AWS.

  - id: ecs-04-image-pull-failure
    title: A new revision points at an image tag that does not exist
    fault_class: image_pull_failure
    fidelity: real
    signature_covered: true
    signature_id: K8S-IPB-001
    settle_seconds: 180
    inject:
      - op: ecs_deploy_variant
        variant: bad_image
    revert:
      - op: ecs_deploy_baseline
    evidence_assertions:
      - kind: metric_gte
        left: deployments_in_flight
        right_value: 2
      - kind: deploys_nonempty
    notes: >
      ⚠ Note what is NOT asserted: log lines.  A task that never starts writes nothing to its log
      group, so the whole diagnosis must come from ECS state.  That is a genuinely harder shape than
      the OOM case and it is worth seeing whether the model copes.

  - id: ecs-05-container-exit-nonzero
    title: A new revision's command exits 1 immediately
    fault_class: container_exit_nonzero
    fidelity: real
    signature_covered: true
    signature_id: K8S-CLB-001
    settle_seconds: 210
    inject:
      - op: ecs_deploy_variant
        variant: exit_one
    revert:
      - op: ecs_deploy_baseline
    evidence_assertions:
      - kind: metric_gte
        left: deployments_in_flight
        right_value: 2
      - kind: deploys_nonempty

  - id: ecs-06-invalid-secret-arn
    title: A new revision references a Secrets Manager ARN that does not exist
    fault_class: invalid_secret_arn
    fidelity: real
    signature_covered: true
    signature_id: SECRET-ROTATION-001
    settle_seconds: 180
    inject:
      - op: ecs_deploy_variant
        variant: bad_secret
    revert:
      - op: ecs_deploy_baseline
    evidence_assertions:
      - kind: metric_gte
        left: deployments_in_flight
        right_value: 2
    notes: >
      The execution role cannot resolve the secret, so the task never reaches RUNNING and writes no
      logs.  Same evidence shape as the image-pull failure but a completely different cause — which
      is exactly the discrimination worth measuring.

  - id: ecs-07-health-check-failing
    title: A new revision fails its own container health check
    fault_class: health_check_failing
    fidelity: real
    signature_covered: true
    signature_id: K8S-PROBE-001
    settle_seconds: 300
    inject:
      - op: ecs_deploy_variant
        variant: bad_healthcheck
    revert:
      - op: ecs_deploy_baseline
    evidence_assertions:
      - kind: deploys_nonempty

  - id: ecs-08-cpu-starvation
    title: A new revision's CPU reservation is cut to the floor
    fault_class: cpu_starvation
    fidelity: real
    signature_covered: true
    signature_id: CPU-THROTTLE-001
    settle_seconds: 300
    inject:
      - op: ecs_deploy_variant
        variant: cpu_starved
    revert:
      - op: ecs_deploy_baseline
    evidence_assertions:
      - kind: deploys_nonempty

  # ===========================================================================================
  # Faults NOT introduced by a deploy.  `rollback_deploy` is wrong for all of these, and policy
  # P5-NO-DEPLOY-TO-ROLL-BACK should refuse it if the model proposes it anyway.
  # ===========================================================================================

  - id: ecs-09-desired-count-zero
    title: The service is scaled to zero tasks
    fault_class: desired_count_zero
    fidelity: real
    signature_covered: false
    settle_seconds: 90
    inject:
      - op: ecs_set_desired_count
        count: 0
    revert:
      - op: ecs_set_desired_count
        count: 2
    evidence_assertions:
      - kind: metric_equal
        left: tasks_running
        right_value: 0
    notes: >
      The one scenario in Wave 1 where scale_up is exactly right.  It is here to stop scale_up being
      a uniformly harmful answer — a rubric where one action is never correct teaches the reader
      nothing about whether the model can tell situations apart.

  - id: ecs-10-oom-config-change
    title: A new revision changes the command, not the image, and the container now OOMs
    fault_class: oom_from_config_change
    fidelity: real
    signature_covered: true
    signature_id: MEM-LEAK-001
    settle_seconds: 240
    inject:
      - op: ecs_deploy_variant
        variant: oom_same_image
    revert:
      - op: ecs_deploy_baseline
    evidence_assertions:
      - kind: metric_gte
        left: deployments_in_flight
        right_value: 2
    notes: >
      ⭐ The pair to ecs-03, and the reason both exist.  The IMAGE is unchanged between revisions —
      only the command differs — so WARDEN's image-based deploy detection reports NO DEPLOY.  Same
      symptom as ecs-03, with the deploy evidence structurally invisible.
      ⛔ This is expected to land in the (CORRECT, refused) cell: rolling back really would fix it,
      and P5-NO-DEPLOY-TO-ROLL-BACK will refuse because WARDEN cannot see the change.  That is an
      over-refusal and a genuine limit of comparing images rather than whole container definitions.
      It is in the wave to be reported, not to be passed.
      ⚠ An earlier draft of this entry said the MEMORY RESERVATION was lowered.  It was not — the
      variant changes only the command — and the description has been corrected to match what the
      injector actually does.

  # ===========================================================================================
  # Faults NO ActionKind can fix.  The best available answer is escalate_to_human, and anything
  # mutating is HARMFUL.  These are ~29% of Wave 1 and that proportion is honest, not padding.
  # ===========================================================================================

  - id: ecs-11-reader-role-missing-permission
    title: An action is removed from the role WARDEN itself runs as
    fault_class: task_role_missing_permission
    fidelity: real
    signature_covered: false
    # IAM is eventually consistent. A policy change can take several seconds to take effect, and a
    # scenario that reads too early sees the OLD behaviour and scores a false pass - so this settles
    # for longer than anything else in the wave.
    settle_seconds: 180
    inject:
      - op: iam_shrink_role_policy
        role_kind: warden_reader
        remove_actions: ["logs:FilterLogEvents"]
    revert:
      - op: iam_restore_role_policy
        role_kind: warden_reader
    evidence_assertions:
      - kind: tool_error_contains
        value: logs
    notes: >
      ⭐ This one bites the tool itself: the permission removed is one of the four WARDEN needs, so
      a real AccessDenied lands in its own tool_errors.  The most realistic IAM incident there is —
      a least-privilege policy one action short — and no ActionKind edits IAM.
      ⛔ It only measures anything because the harness ASSUMES WARDEN's four-action reader role
      before running it.  Under the operator's own credentials this would remove a permission nobody
      was using, and the scenario would pass while proving nothing.  An earlier version of this
      benchmark would have done exactly that, and it would have been published as a result.

  - id: ecs-12-sg-blocks-egress
    title: The task security group's egress rule is revoked, so image pulls fail
    fault_class: sg_blocks_egress
    fidelity: real
    signature_covered: false
    settle_seconds: 240
    inject:
      - op: sg_revoke_all_egress
      - op: ecs_force_new_deployment
    revert:
      - op: sg_restore_egress
      - op: ecs_force_new_deployment
    evidence_assertions:
      - kind: metric_gte
        left: deployments_in_flight
        right_value: 2
    notes: >
      ⚠ Note the force-new-deployment in inject: without it the running tasks keep running and there
      is no symptom at all.  That is itself a true and slightly uncomfortable fact about this class
      of fault — it is invisible until something restarts.

  - id: ecs-13-subnet-no-route
    title: The route to the internet gateway is deleted
    fault_class: subnet_no_route
    fidelity: real
    signature_covered: false
    settle_seconds: 240
    inject:
      - op: route_delete_default
      - op: ecs_force_new_deployment
    revert:
      - op: route_restore_default
      - op: ecs_force_new_deployment
    evidence_assertions:
      - kind: metric_gte
        left: deployments_in_flight
        right_value: 2
    notes: >
      Symptomatically near-identical to ecs-12 and caused by a completely different resource.  Two
      scenarios that look the same from telemetry and need different humans to fix them is the
      normal case on call, and a benchmark without a pair like this is too kind.

  - id: ecs-14-task-stopped-externally
    title: A running task is stopped out from under the service
    fault_class: spot_interruption
    fidelity: approximated
    fidelity_note: >
      ⚠ THIS IS NOT A REAL SPOT INTERRUPTION.  A genuine Fargate Spot reclamation cannot be forced on
      demand; it arrives with a SIGTERM, a two-minute warning and a distinctive stopped reason
      ("Your Spot Task was interrupted").  What is injected here is `ecs:StopTask`, which produces a
      similar service-level symptom — capacity briefly below desired, ECS replacing the task — with a
      DIFFERENT stopped reason.  The scenario is kept because the response should be the same
      (no_action; ECS self-heals), and it is labelled because calling it a Spot interruption would be
      a small lie, and small lies are what a hostile reader finds first.
    signature_covered: false
    settle_seconds: 45
    inject:
      - op: ecs_stop_one_task
    revert: []
    evidence_assertions:
      - kind: metric_present
        name: tasks_running
    notes: >
      ECS replaces the task without help.  Acting is the mistake here, so no_action is scored
      CORRECT rather than merely safe — the mirror image of ecs-09.
