[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-killswitch"
dynamic = ["version"]
description = "Operational safety controls for autonomous AI agents - kill switch, heartbeat, circuit breaker"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    # Name only, deliberately. PyPI metadata is permanent per release and is scraped
    # continuously; a personal address here becomes unremovable spam bait. Security
    # reports go through GitHub private vulnerability reporting (see SECURITY.md),
    # which is a real private channel rather than an address that may go stale.
    { name = "Veera Rakesh Kethari" },
]
keywords = [
    "ai",
    "agents",
    "safety",
    "killswitch",
    "kill-switch",
    "heartbeat",
    "circuit-breaker",
    "autonomous",
    "llm",
    "guardrail",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis[hiredis]>=5.0"]
langchain = ["langchain-core>=0.2"]
langgraph = ["langgraph>=0.1"]
crewai = ["crewai>=0.1"]
openai = ["openai>=1.0"]
all = [
    "agent-killswitch[redis,langchain,langgraph,crewai,openai]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "nox>=2024.3",
    "fakeredis>=2.21",
]

[project.urls]
Homepage = "https://github.com/veerarakesh56/agent-killswitch"
Documentation = "https://github.com/veerarakesh56/agent-killswitch#readme"
Repository = "https://github.com/veerarakesh56/agent-killswitch"
Issues = "https://github.com/veerarakesh56/agent-killswitch/issues"
Changelog = "https://github.com/veerarakesh56/agent-killswitch/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/agent_killswitch/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_killswitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "redis: marks tests requiring Redis",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
    "chaos: marks chaos/fault-injection tests",
    "performance: marks performance benchmark tests",
    "security: marks security tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# The framework integrations are OPTIONAL EXTRAS (`pip install agent-killswitch[langchain]`
# and friends). The default type-check environment installs none of them, so their absence
# is a supported configuration rather than a defect - the modules guard every one of these
# imports at runtime. Without these overrides `strict` would fail the build for not having
# installed dependencies the library does not require.
[[tool.mypy.overrides]]
# Only the two that mypy actually reaches: the other integrations (langgraph, crewai,
# redis) import their dependency inside a guarded block, so mypy never resolves them and
# listing them here would just be an unused override.
module = [
    "langchain_core.*",
    "openai.*",
]
ignore_missing_imports = true

# LangChain's BaseCallbackHandler is untyped from mypy's point of view when the package is
# absent, so subclassing it reads as subclassing Any. That is inherent to integrating with
# an optional third-party base class, not a typing weakness of this package.
[[tool.mypy.overrides]]
module = "agent_killswitch.integrations.langchain"
disallow_subclassing_any = false

[tool.coverage.run]
source = ["agent_killswitch"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "pass",
    "\\.\\.\\.",
]
show_missing = true
fail_under = 80
